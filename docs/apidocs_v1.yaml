openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://3.39.133.123:8080
    description: Generated server url
paths:
  /api/v1/running:
    get:
      tags:
        - running-controller
      operationId: runningCheck
      responses:
        "200":
          description: OK
  /api/v1/posts:
    get:
      tags:
        - post-controller
      operationId: getPostList
      parameters:
        - name: lastPostId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SliceResponsePostListResponse"
  /api/v1/posts/{postId}:
    get:
      tags:
        - post-controller
      summary: 게시글 상세 조회
      operationId: getPostDetail
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetailResponse"
        "404":
          description: 게시글을 찾을 수 없음
  /api/v1/login:
    post:
      tags:
        - Auth API
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
  /api/v1/signup:
    post:
      tags:
        - MyPage API
      summary: 회원 가입
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "200":
          description: OK
  /api/v1/admin/members:
    get:
      tags:
        - Admin Member API
      summary: 회원 목록 조회
      operationId: getMembers
      responses:
        "200":
          description: 회원 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMemberResponse"
        "403":
          description: 관리자 권한 없음
  /api/v1/admin/members/{memberId}/block:
    patch:
      tags:
        - Admin Member API
      summary: 회원 계정 정지
      operationId: blockMember
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 회원 계정 정지 성공
        "403":
          description: 관리자 권한 없음
        "404":
          description: 존재하지 않는 회원
  /api/v1/profile/{memberId}:
    get:
      tags:
        - MyPage API
      operationId: getMyProfile
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 프로필 조회 성공
        "401":
          description: 인증 필요
  /api/v1/payments/prepare:
    post:
      tags:
        - payment-controller
      operationId: preparePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentPrepareRequestDto"
      responses:
        "200":
          description: OK
  /api/v1/payments/complete:
    post:
      tags:
        - payment-controller
      operationId: completePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCompleteRequestDto"
      responses:
        "200":
          description: OK
        "400":
          description: 결제 실패 또는 검증 결과
components:
  schemas:
    PostListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: integer
          format: int32
        content:
          type: string
        bgmUrl:
          type: string
        isSubscriberOnly:
          type: boolean
        hashtags:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        memberId:
          type: integer
          format: int64
        nickname:
          type: string
        profileImage:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        likeCount:
          type: integer
          format: int64
        commentCount:
          type: integer
          format: int64
    SliceResponsePostListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PostListResponse"
        hasNext:
          type: boolean
        lastPostId:
          type: integer
          format: int64
    PostDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        bgmUrl:
          type: string
        isSubscriberOnly:
          type: integer
          format: int32
        hashtags:
          type: string
        memberId:
          type: integer
          format: int64
        authorName:
          type: string
        authorProfileImage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponse"
    CommentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        commenterId:
          type: integer
          format: int64
        commenterNickname:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    PostCreateRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        bgmUrl:
          type: string
        isSubscriberOnly:
          type: integer
        hashtags:
          type: string
    PostCreateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    SignUpRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        nickname:
          type: string
        species:
          type: string
        sex:
          type: string
        birthDate:
          type: string
          format: date
        intro:
          type: string
        profileImage:
          type: string
        address:
          type: string
        isAgreed:
          type: boolean
    SignUpResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        status:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        infoProvideAgreement:
          type: string
          format: date-time
    AdminMemberResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        species:
          type: string
        sex:
          type: string
        birthDate:
          type: string
          format: date
        profileImage:
          type: string
        address:
          type: string
        status:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
    PaymentPrepareRequestDto:
      type: object
      required:
        - targetMemberId
        - orderName
        - totalAmount
        - payMethod
      properties:
        targetMemberId:
          type: integer
        orderName:
          type: string
        totalAmount:
          type: integer
        payMethod:
          type: string
    PaymentCompleteRequestDto:
      type: object
      required:
        - paymentId
      properties:
        paymentId:
          type: string
    PaymentCompleteResponseDto:
      type: object
      properties:
        paymentId:
          type: string
        status:
          type: string
        paidAmount:
          type: integer
        message:
          type: string
